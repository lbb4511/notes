site_name: lbb4511 技术知识图谱
site_url: https://notes.4511.top
site_author: lbb4511
site_description: 个人技术学习知识图谱 - 从入门到精通的学习路径

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search:
      lang: zh

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lbb4511

copyright: Copyright &copy; 2024 lbb4511 | 使用 Material for MkDocs 构建

nav:
  - 首页: index.md
  - 🗺️ 知识图谱:
    - 图谱概览: knowledge-graph.md
    - 技术关联: tech-map.md
    - 标签索引: tags.md
  - 📚 基础知识:
    - 基础概览: basics/index.md
    - 编程语言:
      - Go语言: go/README.md
      - Python: python/README.md
      - Lua脚本: lua/README.md
    - 操作系统:
      - Linux基础: linux/README.md
  - 🚀 进阶技术:
    - 进阶概览: advanced/index.md
    - 微服务架构:
      - Spring Boot: spring-boot/README.md
      - Spring Cloud: spring-cloud/README.md
  - 🌐 生态系统:
    - 生态概览: ecosystem/index.md
  - 🎯 实践案例:
    - 实践概览: practices/index.md
  - 💻 代码示例:
    - Python示例: python/projects/
    - Lua示例: lua/projects/
  - 📜 历史收藏:
    - 历史概览: history/README.md
    - 历史传说: history/legend/

copyright: Copyright &copy; 2024 lbb4511 | 使用 Material for MkDocs 构建
